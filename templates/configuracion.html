
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Configuración | Barbería</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        .config-container {
            max-width: 700px;
            margin: 35px auto;
            padding: 20px;
        }

        .config-card {
            background: var(--card, #fff);
            padding: 25px;
            border-radius: 16px;
        }

        .config-card input,
        .config-card select {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 8px 0 18px;
            box-sizing: border-box;
        }

        .config-card button {
            padding: 12px 20px;
            cursor: pointer;
        }

        .config-card label {
            font-weight: 600;
        }
    </style>
</head>
<body>

<main class="config-container">

    <h1>Configuración de la barbería</h1>

    <p>
        <a href="{{ url_for('admin') }}">← Volver al calendario</a>
    </p>

    {% with mensajes = get_flashed_messages(with_categories=true) %}
        {% for categoria, mensaje in mensajes %}
            <p>{{ mensaje }}</p>
        {% endfor %}
    {% endwith %}

    <form method="POST" class="config-card">

        <h2>Cuenta bancaria</h2>

        <label>Banco</label>
        <input type="text" name="banco_nombre"
               value="{{ configuracion.get('banco_nombre', '') }}"
               placeholder="Ej. Banco Popular">

        <label>Titular de la cuenta</label>
        <input type="text" name="banco_titular"
               value="{{ configuracion.get('banco_titular', '') }}">

        <label>Tipo de cuenta</label>
        <select name="banco_tipo_cuenta">
            <option value="">Seleccionar</option>
            <option value="Ahorro"
                {% if configuracion.get('banco_tipo_cuenta') == 'Ahorro' %}selected{% endif %}>
                Ahorro
            </option>
            <option value="Corriente"
                {% if configuracion.get('banco_tipo_cuenta') == 'Corriente' %}selected{% endif %}>
                Corriente
            </option>
        </select>

        <label>Número de cuenta</label>
        <input type="text" name="banco_numero_cuenta"
               value="{{ configuracion.get('banco_numero_cuenta', '') }}">

        <label>Cédula o documento del titular (opcional)</label>
        <input type="text" name="banco_documento"
               value="{{ configuracion.get('banco_documento', '') }}">

        <hr>

        <h2>Depósito de reserva</h2>

        <label>Porcentaje requerido (%)</label>
        <input type="number" name="porcentaje_deposito"
               min="1" max="100"
               value="{{ configuracion.get('porcentaje_deposito', '50') }}"
               required>

        <button type="submit">Guardar configuración</button>

    </form>

</main>

</body>
</html>
